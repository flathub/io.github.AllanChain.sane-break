id: io.github.AllanChain.sane-break
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: sane-break
finish-args:
  # X11 + XShm access
  - --share=ipc
  - --socket=fallback-x11
  # Wayland access
  - --socket=wayland
  # GPU acceleration if needed
  - --device=dri
  # Tray icon
  - --talk-name=org.kde.StatusNotifierWatcher
  # Audio output
  - --socket=pulseaudio
  # Battery status monitor
  - --system-talk-name=org.freedesktop.UPower
  # Idle status on GNOME
  - --talk-name=org.gnome.Mutter.IdleMonitor
  # Idle inhibitor on KDE
  - --talk-name=org.kde.Solid.PowerManagement
  # Idle/display inhibitor detection (logind, system bus) for inhibitor-aware breaks
  - --system-talk-name=org.freedesktop.login1
modules:
  - name: layer-shell-qt
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_TESTING=OFF
    sources:
      - type: archive
        url: https://download.kde.org/stable/plasma/6.7.4/layer-shell-qt-6.7.4.tar.xz
        sha256: 6a5b064619739c6f4a2de70c56abfbadfc334dcb626152a1e8188a807ca86567
        x-checker-data:
          type: anitya
          project-id: 8761
          stable-only: true
          url-template: https://download.kde.org/stable/plasma/$version/layer-shell-qt-$version.tar.xz
  - name: sane-break
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DLINUX_DIST=Flatpak
    sources:
      - type: git
        url: https://github.com/AllanChain/sane-break.git
        commit: 0ad6bcabceb5b6c711df0d28931f8d0d83e7a797
        tag: v0.10.5
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
          is-main-source: true
