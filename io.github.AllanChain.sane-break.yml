id: io.github.AllanChain.sane-break
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: sane-break
finish-args:
  # X11 + XShm access
  - --share=ipc
  - --socket=fallback-x11
  # Wayland access
  - --socket=wayland
  # GPU acceleration if needed
  - --device=dri
  # Tray icon
  - --talk-name=org.kde.StatusNotifierWatcher
  # Audio output
  - --socket=pulseaudio
  # Battery status monitor
  - --system-talk-name=org.freedesktop.UPower
  # Idle status on GNOME
  - --talk-name=org.gnome.Mutter.IdleMonitor
  # Idle inhibitor on KDE
  - --talk-name=org.kde.Solid.PowerManagement
  # Idle/display inhibitor detection (logind, system bus) for inhibitor-aware breaks
  - --system-talk-name=org.freedesktop.login1
  # Pause media players during breaks (MPRIS2 players register per-instance names
  # such as org.mpris.MediaPlayer2.vlc, so the wildcard is required)
  - --talk-name=org.mpris.MediaPlayer2.*
modules:
  - name: layer-shell-qt
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_TESTING=OFF
    sources:
      - type: archive
        url: https://download.kde.org/stable/plasma/6.7.5/layer-shell-qt-6.7.5.tar.xz
        sha256: ccdcfec7081ca956f7a52c9113a4df3a226575bfbe98b56a2a9a4d7d7e19e8f0
        x-checker-data:
          type: anitya
          project-id: 8761
          stable-only: true
          url-template: https://download.kde.org/stable/plasma/$version/layer-shell-qt-$version.tar.xz
  - name: sane-break
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DLINUX_DIST=Flatpak
    sources:
      - type: git
        url: https://github.com/AllanChain/sane-break.git
        commit: 7bb3548cadf70e93166c7ecda0e2e873315966d7
        tag: v0.10.7
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
          is-main-source: true
